name: CI build & push to GHCR

on:
  workflow_call:
    outputs:
      digest:
        description: "Image content-addressable digest"
        value: ${{ jobs.build_and_push.outputs.digest }}
      repo_path:
        description: "Fully-qualified repo path"
        value: ${{ jobs.build_and_push.outputs.repo_path }}
      registry:
        description: "GHCR registry"
        value: ${{ jobs.build_and_push.outputs.registry }}
  workflow_dispatch: {}

concurrency:
  group: push-ghcr-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  NAMESPACE: ci-runner
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      repo_path: ${{ steps.repo.outputs.repo_path }}
      registry: ${{ steps.repo.outputs.registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute registry & repo path
        id: repo
        shell: bash
        run: |
          echo "registry=${{ env.REGISTRY }}" >> "$GITHUB_OUTPUT"
          echo "repo_path=${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build & push to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.NAMESPACE }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
