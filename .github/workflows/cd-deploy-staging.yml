name: CD deploy to staging

on:
  workflow_run:
    workflows: ["CI build & push to registry"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI run_id for digest"
        required: true
      app_version:
        description: "app version"
        required: true

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy-staging:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    env:
      RELEASE: fastapi-ddd-template
      NAMESPACE: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Download digest artifact (if provided)
        if: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: digest
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}

      - name: Read digest from artifact (if exists) and export
        id: read_export_digest
        run: |
          D=$(cat image_digest_*.txt | tr -d '\n') 
          if ! echo "$D" | grep -q '^sha256:'; then
            echo "Invalid digest in file: $D"; exit 1
          fi
          DIGEST="$(echo "$D" | sed 's/^sha256://')"
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "Digest resolved: $DIGEST"

      - name: Ensure namespace exists
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update fastapi-ddd-template-secrets
        env:
          STAGING_DB_ADMIN_SECRET: ${{ secrets.STAGING_DB_ADMIN_SECRET }}
          STAGING_DB_USER_SECRET: ${{ secrets.STAGING_DB_USER_SECRET }}
          STAGING_FASTAPI_DDD_TEMPLATE_JWT_SECRET: ${{ secrets.STAGING_FASTAPI_DDD_TEMPLATE_JWT_SECRET }}
          STAGING_FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${{ secrets.STAGING_FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN_PASSWORD_HASH }}
        run: |
          kubectl -n staging apply -f - <<YAML
          apiVersion: v1
          kind: Secret
          metadata:
            name: fastapi-ddd-template-secrets
            namespace: staging
          type: Opaque
          stringData:
            DB_ADMIN_SECRET: "${STAGING_DB_ADMIN_SECRET}"
            DB_USER_SECRET: "${STAGING_DB_USER_SECRET}"
            FASTAPI_DDD_TEMPLATE_JWT_SECRET: "${STAGING_FASTAPI_DDD_TEMPLATE_JWT_SECRET}"
            FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN_PASSWORD_HASH: "${STAGING_FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN_PASSWORD_HASH}"
          YAML

      - name: Set IMAGE_REPOSITORY (lowercased)
        run: echo "IMAGE_REPOSITORY=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Derive APP_VERSION
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          if [[ "$BRANCH" == release/* ]]; then
            echo "APP_VERSION=${BRANCH#release/}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=${{ inputs.app_version }}" >> $GITHUB_ENV
          fi

      - name: Helm upgrade (staging)
        run: |
          helm upgrade --install "$RELEASE" deploy/helm \
            --namespace "$NAMESPACE" --create-namespace \
            -f deploy/helm/values-staging.yaml \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.digest="$IMAGE_DIGEST" \
            --set app.version="$APP_VERSION" \
            --set-file dbBootstrap.script=deploy/bootstrap/bootstrap_db.sh

      - name: Wait rollout (staging: db ➜ db-bootstrap ➜ api)
        shell: bash
        run: |
          set -euo pipefail

          echo "⏳ Waiting for DB Deployment..."
          kubectl -n "$NAMESPACE" rollout status deploy/"$RELEASE"-db --timeout=180s
          kubectl -n "$NAMESPACE" wait pod \
            -l app.kubernetes.io/instance="$RELEASE",app.kubernetes.io/component=db \
            --for=condition=Ready --timeout=120s

          echo "⏳ Waiting for DB bootstrap Job to complete..."
          kubectl -n "$NAMESPACE" wait job/"$RELEASE"-db-bootstrap \
            --for=condition=complete --timeout=300s

          echo "⏳ Waiting for API Deployment..."
          kubectl -n "$NAMESPACE" rollout status deploy/"$RELEASE"-api --timeout=180s
          kubectl -n "$NAMESPACE" wait pod \
            -l app.kubernetes.io/instance="$RELEASE",app.kubernetes.io/component=api \
            --for=condition=Ready --timeout=120s

          echo "✅ Current resources for release $RELEASE:"
          kubectl -n "$NAMESPACE" get deploy,sts,job,svc,pods \
            -l app.kubernetes.io/instance="$RELEASE" -o wide

      - name: Smoke / Integration / E2E (stubs)
        run: |
          make test-smoke
          make test-int-staging
          make test-e2e

      - name: Get logs on failure (db ▸ db-bootstrap ▸ api)
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Summary of resources"
          kubectl -n "$NAMESPACE" get deploy,sts,job,svc,pods -l app.kubernetes.io/instance="$RELEASE" -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.metadata.creationTimestamp | tail -n 200 || true
          echo "::endgroup::"

          echo "::group::DB: describe & logs"
          # describe обоих вариантов (staging=Deployment, prod=StatefulSet)
          kubectl -n "$NAMESPACE" describe deploy/"$RELEASE"-db || true
          kubectl -n "$NAMESPACE" describe statefulset/"$RELEASE"-db || true
          kubectl -n "$NAMESPACE" describe svc/"$RELEASE"-db || true

          # логи всех pod’ов DB (текущие и предыдущие, на случай рестартов)
          for p in $(kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/instance="$RELEASE",app.kubernetes.io/component=db -o name); do
            echo "--- logs $p (current) ---"
            kubectl -n "$NAMESPACE" logs "$p" --all-containers --tail=500 || true
            echo "--- logs $p (previous) ---"
            kubectl -n "$NAMESPACE" logs "$p" --all-containers --tail=500 --previous || true
            echo "--- describe $p events ---"
            kubectl -n "$NAMESPACE" describe "$p" | sed -n '/Events:/,$p' || true
          done
          echo "::endgroup::"

          echo "::group::DB-BOOTSTRAP: describe & logs"
          kubectl -n "$NAMESPACE" describe job/"$RELEASE"-db-bootstrap || true
          # pod'ы джобы помечаются label'ом job-name
          for p in $(kubectl -n "$NAMESPACE" get pods -l job-name="$RELEASE"-db-bootstrap -o name); do
            echo "--- logs $p (current) ---"
            kubectl -n "$NAMESPACE" logs "$p" --all-containers --tail=1000 || true
            echo "--- logs $p (previous) ---"
            kubectl -n "$NAMESPACE" logs "$p" --all-containers --tail=1000 --previous || true
            echo "--- describe $p events ---"
            kubectl -n "$NAMESPACE" describe "$p" | sed -n '/Events:/,$p' || true
          done
          echo "::endgroup::"

          echo "::group::API: describe & logs"
          kubectl -n "$NAMESPACE" describe deploy/"$RELEASE"-api || true
          kubectl -n "$NAMESPACE" describe svc/"$RELEASE"-api || true

          for p in $(kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/instance="$RELEASE",app.kubernetes.io/component=api -o name); do
            echo "--- logs $p (current) ---"
            kubectl -n "$NAMESPACE" logs "$p" --all-containers --tail=1000 || true
            echo "--- logs $p (previous) ---"
            kubectl -n "$NAMESPACE" logs "$p" --all-containers --tail=1000 --previous || true
            echo "--- describe $p events ---"
            kubectl -n "$NAMESPACE" describe "$p" | sed -n '/Events:/,$p' || true
          done
          echo "::endgroup::"
