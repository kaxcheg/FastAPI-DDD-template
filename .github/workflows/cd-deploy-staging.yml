name: CD deploy to staging

on:
  workflow_run:
    workflows: ["CI build & push to registry"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI run_id for digest"
        required: true
      app_version:
        description: "app version"
        required: true

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy-staging:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    env:
      HELM_RELEASE: fastapi-ddd-template-api
      NAMESPACE: staging
      # IMAGE_REPOSITORY: placeholder
      # если CI тегирует как staging-<sha>, можно хранить для fallback
      # IMAGE_TAG: staging-${{ github.sha }}
      # APP_VERSION: ${{ startsWith(github.ref_name, 'release/') && replace(github.ref_name, 'release/', '') || inputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Download digest artifact (if provided)
        if: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: digest
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}

      - name: Read digest from artifact (if exists) and export
        id: read_export_digest
        run: |
          D=$(cat image_digest_*.txt | tr -d '\n') 
          if ! echo "$D" | grep -q '^sha256:'; then
            echo "Invalid digest in file: $D"; exit 1
          fi
          DIGEST="$(echo "$D" | sed 's/^sha256://')"
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "Digest resolved: $DIGEST"

      # --- Fallback (вариант B): вычислить digest по тегу через skopeo
      # - name: Fallback resolve digest via skopeo
      #   if: ${{ steps.read_digest.outputs.digest == '' }}
      #   run: |
      #     sudo apt-get update -y && sudo apt-get install -y skopeo jq
      #     D=$(skopeo inspect docker://$IMAGE_REPOSITORY:$IMAGE_TAG | jq -r .Digest | sed 's/^sha256://')
      #     echo "$D" > image-digest.txt

      # - name: Export IMAGE_DIGEST
      #   id: export_digest
      #   run: |
      #     if [ -s image-digest.txt ]; then
      #       D=$(cat image-digest.txt | tr -d '\n' | sed 's/^sha256://')
      #       echo "IMAGE_DIGEST=$D" >> $GITHUB_ENV
      #       echo "Digest resolved: $D"
      #     else
      #       echo "No digest found" >&2
      #       exit 1
      #     fi

      # --- imagePullSecret для GHCR (если частный образ)
      # - name: Create/Update GHCR pull secret
      #   if: ${{ secrets.GHCR_PAT != '' }}
      #   run: |
      #     kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      #     kubectl -n "$NAMESPACE" create secret docker-registry ghcr \
      #       --docker-server=ghcr.io \
      #       --docker-username="${{ secrets.GHCR_USER || github.actor }}" \
      #       --docker-password="${{ secrets.GHCR_PAT }}" \
      #       --dry-run=client -o yaml | kubectl apply -f -

      # - name: Derive APP_VERSION from release branch
      #   if: startsWith(github.ref_name, 'release/')
      #   run: |
      #     APP_VERSION="${GITHUB_REF_NAME#release/}"
      #     echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      # - name: Derive APP_VERSION from input
      #   if: ${{ !startsWith(github.ref_name, 'release/') }}
      #   run: |
      #     APP_VERSION=${{ inputs.app_version }}
      #     echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Ensure namespace exists
        run: kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -


      # --- Helm upgrade --install с digest

      # Create/Update Secret из GitHub Secrets
      - name: Create/Update fastapi-ddd-template-secrets
        env:
          STAGING_DB_ADMIN_PASSWORD: ${{ secrets.STAGING_DB_ADMIN_PASSWORD }}
          STAGING_DB_USER_PASSWORD: ${{ secrets.STAGING_DB_USER_PASSWORD }}
          STAGING_FASTAPI_DDD_TEMPLATE_JWT_SECRET: ${{ secrets.STAGING_FASTAPI_DDD_TEMPLATE_JWT_SECRET }}
          STAGING_FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${{ secrets.STAGING_FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN_PASSWORD_HASH }}
        run: |
          kubectl -n staging apply -f - <<YAML
          apiVersion: v1
          kind: Secret
          metadata:
            name: fastapi-ddd-template-secrets
            namespace: staging
          type: Opaque
          stringData:
            DB_ADMIN_PASSWORD: "${STAGING_DB_ADMIN_PASSWORD}"
            DB_USER_PASSWORD: "${STAGING_DB_USER_PASSWORD}"
            FASTAPI_DDD_TEMPLATE_JWT_SECRET: "${STAGING_FASTAPI_DDD_TEMPLATE_JWT_SECRET}"
            FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN_PASSWORD_HASH: "${STAGING_FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN_PASSWORD_HASH}"
          YAML

      - name: Set IMAGE_REPOSITORY (lowercased)
        run: echo "IMAGE_REPOSITORY=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Derive APP_VERSION
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          if [[ "$BRANCH" == release/* ]]; then
            echo "APP_VERSION=${BRANCH#release/}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=${{ inputs.app_version }}" >> $GITHUB_ENV
          fi


      - name: Helm upgrade (staging)
        run: |
          helm upgrade --install "$HELM_RELEASE" deploy/helm/fastapi-ddd-template-api \
            --namespace "$NAMESPACE" --create-namespace \
            -f deploy/helm/fastapi-ddd-template-api/values-staging.yaml \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.digest="$IMAGE_DIGEST" \
            --set app.version="$APP_VERSION" \
          $( [ -n "${{ secrets.GHCR_PAT }}" ] && echo "--set image.pullSecrets[0].name=ghcr" )

      - name: Wait rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/$HELM_RELEASE --timeout=120s
          kubectl -n "$NAMESPACE" get pods,svc -o wide
          
      # - name: Health check API
      #   run: |
      #     kubectl -n staging rollout status deploy/fastapi-ddd-template-api --timeout=300s
      #     kubectl -n staging get svc

      - name: Smoke / Integration / E2E (stubs)
        run: |
          make test-smoke
          make test-int-staging
          make test-e2e

      - name: On failure dump k8s state
        if: failure()
        run: |
          kubectl -n staging get all
          kubectl -n staging describe pods
          kubectl -n staging logs -l app=db --tail=200 || true
          kubectl -n staging logs -l app=fastapi-ddd-template-api --tail=200 || true
