name: CD cleanup prod (uninstall)

on:
  workflow_dispatch: {}

concurrency:
  group: cleanup-staging-dddapitpl-${{ vars.NAMESPACE }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NAMESPACE: prod
  RELEASE: dddapitpl

jobs:
  cleanup:
    runs-on: [self-hosted, ec2, staging]
    steps:
      - name: Ensure k3s context
        shell: bash
        run: |
          sudo mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown $(id -u):$(id -g) ~/.kube/config
      - name: Uninstall release & delete PVC
        shell: bash
        run: |
          helm uninstall "$RELEASE" -n "$NAMESPACE" || true
      - name: (Optional) Keep log group; no action
        run: echo "CloudWatch logs retained by design"
