name: Release to CI runner

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write

env:
  NAMESPACE: staging
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build_and_push:
    uses: ./.github/workflows/ci-push-to-ecr.yml
    secrets: inherit

  deploy_staging:
    needs: build_and_push
    uses: ./.github/workflows/cd-deploy-ci-runner.yml
    secrets: inherit
    with:
      digest: ${{ needs.build_and_push.outputs.digest }}
      repo_path: ${{ needs.build_and_push.outputs.repo_path }}
      registry: ${{ needs.build_and_push.outputs.registry }}
