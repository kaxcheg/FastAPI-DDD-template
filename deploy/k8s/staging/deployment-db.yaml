apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
      - name: db
        image: postgres:16
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: STAGING_DB_ADMIN } }
        - name: POSTGRES_DB
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: STAGING_DB_PATH } }
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/db_admin_secret_file
        readinessProbe:
          exec: { command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec: { command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: db-secrets
          mountPath: /run/secrets
          readOnly: true
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-secrets
        secret:
          secretName: fastapi-ddd-template-secrets
          items:
          - key: DB_ADMIN_SECRET
            path: db_admin_secret_file
      - name: pgdata
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: staging
spec:
  selector: { app: db }
  ports:
  - name: psql
    port: 5432
    targetPort: 5432
