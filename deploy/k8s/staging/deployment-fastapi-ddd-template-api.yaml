apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-ddd-template-api
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: fastapi-ddd-template-api }
  template:
    metadata:
      labels: { app: fastapi-ddd-template-api }
    spec:
      containers:
      - name: api
        # образ подменим в CI (staging-<sha> либо @digest)
        image: ghcr.io/OWNER/REPO:staging-SHA
        imagePullPolicy: IfNotPresent
        command:
          - python
          - ./entrypoint.py
          - uvicorn
          - app.interface.http.main:app
          - --host
          - "$(SERVER_HOST)"
          - --port
          - "$(SERVER_PORT)"
        env:
        # ── application settings
        - name: FASTAPI_DDD_TEMPLATE_ENV
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: FASTAPI_DDD_TEMPLATE_ENV } }
        - name: FASTAPI_DDD_TEMPLATE_DEBUG
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: FASTAPI_DDD_TEMPLATE_DEBUG } }
        - name: FASTAPI_DDD_TEMPLATE_LOG_DIR
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: FASTAPI_DDD_TEMPLATE_LOG_DIR } }
        - name: FASTAPI_DDD_TEMPLATE_JWT_ALGORITHM
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: FASTAPI_DDD_TEMPLATE_JWT_ALGORITHM } }
        - name: FASTAPI_DDD_TEMPLATE_JWT_TOKEN_EXPIRY_TIME
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: FASTAPI_DDD_TEMPLATE_JWT_TOKEN_EXPIRY_TIME } }

        # ── db settings
        - name: DB_DRIVER
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: DB_DRIVER } }
        - name: DB_USER
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: DB_USER } }
        - name: DB_PATH
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: DB_PATH } }
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: DB_HOST } }
        - name: DB_TABLE_SCHEMA
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: DB_TABLE_SCHEMA } }

        # ── bootstrap flags
        - name: FASTAPI_DDD_TEMPLATE_BOOTSTRAP_FLAG
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: FASTAPI_DDD_TEMPLATE_BOOTSTRAP_FLAG } }
        - name: FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN } }

        - name: SERVER_HOST
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: SERVER_HOST } }
        - name: SERVER_PORT
          valueFrom: { configMapKeyRef: { name: fastapi-ddd-template-config, key: SERVER_PORT } }

        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 15
          periodSeconds: 20

        volumeMounts:
        - name: api-secrets
          mountPath: /run/secrets
          readOnly: true
        - name: applogs
          mountPath: /fastapi_ddd_template/logs
      volumes:
      - name: api-secrets
        secret:
          secretName: fastapi-ddd-template-secrets
          items:
          - key: DB_USER_SECRET
            path: db_user_secret
          - key: FASTAPI_DDD_TEMPLATE_JWT_SECRET
            path: fastapi_ddd_template_jwt_secret
          - key: FASTAPI_DDD_TEMPLATE_BOOTSTRAP_ADMIN_PASSWORD_HASH
            path: fastapi_ddd_template_bootstrap_admin_password_hash
      - name: applogs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-ddd-template-api
  namespace: staging
spec:
  selector: { app: fastapi-ddd-template-api }
  ports:
  - name: http
    port: 80
    targetPort: 8000
