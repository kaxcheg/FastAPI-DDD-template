apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapi-ddd-template-api.fullname" . }}
  labels:
    app: {{ include "fastapi-ddd-template-api.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "fastapi-ddd-template-api.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "fastapi-ddd-template-api.fullname" . }}
        app.kubernetes.io/version: {{ default .Chart.AppVersion .Values.app.version | quote }}
      annotations:
        {{- if and .Values.config.enabled .Values.config.data }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.secrets.revision }}
        secrets/revision: {{ .Values.secrets.revision | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "fastapi-ddd-template-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          {{- if or .Values.config.enabled .Values.config.existingName .Values.secrets.existingName .Values.extraEnv }}
          envFrom:
            {{- if or .Values.config.enabled .Values.config.existingName }}
            - configMapRef:
                name: {{ include "fastapi-ddd-template-api.configName" . }}
            {{- end }}
            {{- if .Values.secrets.existingName }}
            - secretRef:
                name: {{ .Values.secrets.existingName | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.extraEnv }}
          env:
            {{- toYaml .Values.extraEnv | nindent 12 }}
          {{- end }}
